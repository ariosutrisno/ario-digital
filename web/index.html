<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Ario Sutrisno — Technology, Data, AI, and Digital Transformation portfolio.">
  <meta name="theme-color" content="#eeede9">
  <meta property="og:title" content="Ario Sutrisno — Technology Portfolio">
  <meta property="og:description" content="Engineering systems that turn complex operations into measurable business impact.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ARIO DIGITAL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>Ario Sutrisno — Technology Portfolio</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    const siteTitle = 'ARIO DIGITAL — Solusi Digital untuk Bisnis';
    document.title = siteTitle;
    document.querySelector('meta[name="description"]')?.setAttribute(
      'content',
      'ARIO DIGITAL membangun website, aplikasi bisnis, dashboard, dan solusi digital praktis untuk bisnis modern.',
    );
    document.querySelector('meta[property="og:title"]')?.setAttribute('content', siteTitle);
    document.querySelector('meta[property="og:description"]')?.setAttribute(
      'content',
      'Ubah ide dan proses manual menjadi website, aplikasi, dashboard, dan solusi digital yang praktis.',
    );
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
